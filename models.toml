# slm-audit model configuration
# First run auto-downloads the selected model from HuggingFace via kalosm

[model]
# Presets:
#   "phi3"   - Phi-3-mini-4k-instruct (~2.2GB, recommended, strong at code/reasoning)
#   "llama3" - Llama-3.2-3B-Instruct  (~1.9GB, lighter alternative)
preset = "phi3"

# To use a custom GGUF model, set preset = "custom" and fill in:
# [model.custom]
# repo_id  = "Qwen/Qwen2.5-Coder-3B-Instruct-GGUF"
# filename = "qwen2.5-coder-3b-instruct-q4_k_m.gguf"
