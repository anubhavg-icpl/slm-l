[package]
name = "slm-l"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "slm-audit"
path = "src/main.rs"

[dependencies]
kalosm = { version = "0.4", features = ["language"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
walkdir = "2.5"
regex = "1.11"
colored = "3"
anyhow = "1.0"
futures = "0.3"
