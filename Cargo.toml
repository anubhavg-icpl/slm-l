[package]
name = "slm-l"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "slm-audit"
path = "src/main.rs"

[dependencies]
kalosm = { version = "0.4", features = ["language"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
regex = "1"
colored = "2"
anyhow = "1"
futures = "0.3"
